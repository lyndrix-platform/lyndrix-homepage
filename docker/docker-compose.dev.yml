services:
  homepage:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lyndrix-homepage-dev
    ports:
      - "4321:4321"
    volumes:
      - ../:/workspace
      - homepage_node_modules:/workspace/node_modules
    environment:
      NODE_ENV: development
    command: npm run dev -- --host 0.0.0.0 --port 4321

volumes:
  homepage_node_modules: